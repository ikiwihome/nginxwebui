name: Build nginxwebui jar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prepare jar
        shell: bash
        run: |
          shopt -s nullglob
          jars=(target/nginxwebui-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one nginxwebui jar, found ${#jars[@]}" >&2
            exit 1
          fi
          mkdir -p dist
          cp "${jars[0]}" dist/nginxwebui.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nginxwebui-jar
          path: dist/nginxwebui.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: nginxwebui-jar
          path: dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/nginxwebui.jar --clobber
          else
            gh release create "$TAG_NAME" dist/nginxwebui.jar --verify-tag --generate-notes
          fi
